name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Generate Gradle wrapper when absent
        shell: bash
        run: |
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Commit generated wrapper
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- gradlew gradlew.bat gradle/wrapper)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper
            git commit -m "Add Gradle 8.9 wrapper"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload generated wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-bootstrap
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 7

      - name: Run unit tests
        shell: bash
        run: |
          mkdir -p build-logs
          set -o pipefail
          ./gradlew \
            :core:model:test \
            :core:effects:test \
            :core:recipes:test \
            :core:render-api:test \
            :core:render-kotlin:test \
            :core:projects:testDebugUnitTest \
            :feature:editor:testDebugUnitTest \
            :app:testDebugUnitTest \
            --stacktrace --no-daemon 2>&1 | tee build-logs/unit-tests.log

      - name: Run Android lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --stacktrace --no-daemon 2>&1 | tee build-logs/lint.log

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build-logs/assemble.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: distaut-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            build-logs/**
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
