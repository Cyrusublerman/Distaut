name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew --version

      - name: Run unit tests
        shell: bash
        run: |
          mkdir -p build-logs
          set -o pipefail
          ./gradlew \
            :core:model:test \
            :core:effects:test \
            :core:recipes:test \
            :core:render-api:test \
            :core:render-kotlin:test \
            :core:projects:testDebugUnitTest \
            :feature:editor:testDebugUnitTest \
            :app:testDebugUnitTest \
            --stacktrace --no-daemon 2>&1 | tee build-logs/unit-tests.log

      - name: Run Android lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --stacktrace --no-daemon 2>&1 | tee build-logs/lint.log

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build-logs/assemble.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: distaut-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            build-logs/**
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
